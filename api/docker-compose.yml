# Local development database only. Not for production.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: proofly
      POSTGRES_PASSWORD: proofly
      POSTGRES_DB: proofly
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - proofly-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofly"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Virus scanner (Week 6, Day 4). The first start downloads virus signatures
  # (a few hundred MB) and can take a few minutes before it answers.
  clamav:
    image: clamav/clamav:stable
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - proofly-clamav:/var/lib/clamav

volumes:
  proofly-db:
  proofly-clamav: